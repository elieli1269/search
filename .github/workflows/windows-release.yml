name: Windows EXE

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Semantic-AI-Browser-Windows
          path: release/*.exe
