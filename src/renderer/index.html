<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Semantic AI Browser</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="zero-shell" data-mode="idle" data-student-mode="false">
      <header class="topbar" aria-label="Navigation et IA">
        <div class="brand-orb" id="voiceOrb"><span></span></div>
        <nav class="tab-strip" id="tabStrip" aria-label="Onglets"></nav>
        <button id="newTabButton" class="icon-button" title="Nouvel onglet">＋</button>
        <button id="newWindowButton" class="icon-button" title="Nouvelle fenêtre">□</button>
        <input id="address" aria-label="Recherche ou URL" placeholder="URL, recherche Google ou /commande vocale…" />
        <button id="quizButton" class="quiz-button" hidden>Quiz</button>
        <input id="quickKey" type="password" placeholder="Clé Groq locale" title="Entrée pour enregistrer localement" />
      </header>

      <section id="webviewStack" class="webview-stack" aria-label="Pages de navigation"></section>

      <footer class="statusbar" aria-live="polite">
        <span id="currentUrl">https://www.wikipedia.org</span>
        <span id="securityState">Confidentialité: clé locale ou variable d’environnement</span>
        <span id="microState">Micro: veille</span>
        <span id="contextStateLabel">Contexte: initialisation</span>
        <span id="quizWhisper"></span>
      </footer>
    </main>

    <dialog id="settingsDialog">
      <form method="dialog" class="settings-card">
        <h2>Paramètres invisibles</h2>
        <p>Les clés Groq restent locales et persistantes sur cette machine. Utilise aussi <code>GROQ_API_KEY</code> pour éviter tout stockage applicatif.</p>
        <label>Modèle raisonnement Groq<input id="modelInput" value="llama-3.3-70b-versatile" /></label>
        <label>Modèle transcription<input id="transcriptionModelInput" value="whisper-large-v3-turbo" /></label>
        <label class="toggle-row"><input id="studentModeInput" type="checkbox" /> Activer le Mode Étudiant</label>
        <label>URL QuizGen<input id="quizGenEndpointInput" value="https://quizzgen.alwaysdata.net" /></label>
        <label>URL NexAccount<input id="nexAccountBaseUrlInput" value="https://nexaccount.alwaysdata.net" /></label>
        <div class="auth-grid"><input id="authUsername" placeholder="Nom utilisateur" /><input id="authEmail" placeholder="Email" /><input id="authPassword" type="password" placeholder="Mot de passe" /></div>
        <div class="auth-actions"><button id="loginButton" type="button">Connexion</button><button id="registerButton" type="button">Inscription</button><button id="logoutButton" type="button">Déconnexion</button></div>
        <small id="authState">Mode invité</small>
        <label>Nom de la clé<input id="keyLabel" placeholder="Groq principale" /></label>
        <label>Clé API<input id="keyValue" type="password" placeholder="gsk_..." /></label>
        <div id="keyList" class="key-list"></div>
        <menu><button id="saveSettings" value="default">Enregistrer</button><button value="cancel">Fermer</button></menu>
      </form>
    </dialog>
    <script src="voice-engine.js"></script>
    <script src="app.js"></script>
  </body>
</html>
