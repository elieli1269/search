<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Semantic AI Browser</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="zero-shell" data-mode="idle">
      <section class="omnibox" aria-label="Interface vocale et recherche">
        <button class="brand-orb" id="voiceButton" type="button" title="Appuie pour parler" aria-label="Appuie pour parler"><span></span></button>
        <input id="address" placeholder="Colle une URL, décris ton intention ou appuie sur le micro…" />
        <div id="stateLabel">IA en veille contextuelle</div>
        <input id="quickKey" type="password" placeholder="Clé Groq locale" />
      </section>

      <webview id="webview" allowpopups></webview>

      <section class="ghost-console" id="ghostConsole" aria-live="polite">
        <div id="lastCommand">Appuie sur le micro puis dis “va sur…”, “compare…”, “trouve…” ou “scrolle…”</div>
        <div id="memoryWhisper"></div>
        <div id="quizWhisper"></div>
      </section>
    </main>

    <dialog id="settingsDialog">
      <form method="dialog" class="settings-card">
        <h2>Paramètres invisibles</h2>
        <p>Les clés Groq restent locales et persistantes sur cette machine. Utilise aussi <code>GROQ_API_KEY</code> pour éviter tout stockage applicatif.</p>
        <label>Modèle raisonnement Groq<input id="modelInput" value="llama-3.3-70b-versatile" /></label>
        <label>Modèle transcription<input id="transcriptionModelInput" value="whisper-large-v3-turbo" /></label>
        <label>Version<select id="experienceModeInput"><option value="explorer">Explorateur</option><option value="student">Étudiant · QuizGen</option></select></label>
        <label>URL QuizGen<input id="quizGenEndpointInput" value="https://quizzgen.alwaysdata.net" /></label>
        <label>Nom de la clé<input id="keyLabel" placeholder="Groq principale" /></label>
        <label>Clé API<input id="keyValue" type="password" placeholder="gsk_..." /></label>
        <div id="keyList" class="key-list"></div>
        <menu><button id="saveSettings" value="default">Enregistrer</button><button value="cancel">Fermer</button></menu>
      </form>
    </dialog>
    <script src="voice-engine.js"></script>
    <script src="app.js"></script>
  </body>
</html>
